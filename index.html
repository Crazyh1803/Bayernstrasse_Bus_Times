<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wiesbaden Downtown Transit Monitor</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
            --accent-color: #2b82c9;
            --border-round: 8px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            padding: 20px;
            border-radius: var(--border-round);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #333333;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.2rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-group {
            display: flex;
            gap: 8px;
        }

        .action-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
        }

        .action-btn.secondary {
            background-color: #3a3a3a;
            color: var(--text-muted);
        }

        .departure-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .bus-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px;
            background: #252525;
            border-radius: 4px;
            border-left: 4px solid #555555;
        }

        .bus-row.line-18 { border-left-color: #e67e22; }
        .bus-row.line-21 { border-left-color: #2ce3b7; }
        .bus-row.line-22 { border-left-color: #2ecc71; }

        .bus-meta {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .line-badge {
            font-weight: bold;
            padding: 4px 8px;
            border-radius: 3px;
            font-size: 1rem;
            min-width: 25px;
            text-align: center;
            background: #3a3a3a;
            color: #fff;
        }

        .line-18 .line-badge { background-color: #e67e22; }
        .line-21 .line-badge { background-color: #2ce3b7; color: #000; }
        .line-22 .line-badge { background-color: #2ecc71; }

        .route-info {
            display: flex;
            flex-direction: column;
        }

        .destination {
            font-weight: bold;
            font-size: 0.95rem;
        }

        .origin-stop {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .time-info {
            text-align: right;
            font-weight: bold;
            font-size: 1.1rem;
            color: #ffcc00;
        }

        .status-msg {
            text-align: center;
            color: var(--text-muted);
            font-style: italic;
            padding: 20px;
        }

        .log-section {
            margin-top: 20px;
            display: none;
        }

        .debug-panel {
            background: #000;
            padding: 10px;
            font-family: monospace;
            font-size: 0.75rem;
            color: #00ff00;
            height: 120px;
            overflow-y: auto;
            border-radius: 4px;
            border: 1px solid #333;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <h1>Wiesbaden Inbound</h1>
            <div style="font-size: 0.75rem; color: var(--text-muted); margin-top: 4px;" id="update-time">Initializing Tracker...</div>
        </div>
        <div class="btn-group">
            <button class="action-btn secondary" onclick="toggleLog()">Log</button>
            <button class="action-btn" onclick="updateDashboard()">Refresh</button>
        </div>
    </header>

    <div id="display-board" class="departure-list">
        <div class="status-msg">Connecting to transit array...</div>
    </div>

    <div id="log-wrapper" class="log-section">
        <div style="font-size: 0.8rem; font-weight: bold; margin-bottom: 6px; color: var(--text-muted);">System Raw Log:</div>
        <div id="debug-log" class="debug-panel">System online. Standby.</div>
    </div>
</div>

<script>
    const STOP_KAPPENBERGWEG = "3025380";
    const STOP_WUERTTEMBERG = "3025585";

    let activeCachedDepartures = [];
    let kappenbergRaw = null;
    let wuerttembergRaw = null;

    function logDebug(msg) {
        const log = document.getElementById("debug-log");
        if (log) {
            log.innerHTML += `<br>[${new Date().toLocaleTimeString()}] ${msg}`;
            log.scrollTop = log.scrollHeight;
        }
    }

    function toggleLog() {
        const logWrapper = document.getElementById("log-wrapper");
        logWrapper.style.display = (logWrapper.style.display === "block") ? "none" : "block";
    }

    window.onNativeDataReceived = function(stationId, base64Data) {
        try {
            const decodedJson = atob(base64Data);
            if (decodedJson.startsWith("ERROR:")) {
                logDebug(`RMV Bridge Fault: ${decodedJson}`);
                processParsedData(stationId, getSimulationData(stationId, stationId === STOP_KAPPENBERGWEG ? ["21", "22"] : ["18"]));
                return;
            }

            const data = JSON.parse(decodedJson);
            if (!data.Departure || data.Departure.length === 0) {
                logDebug(`No routes returned from RMV for stop ${stationId}`);
                processParsedData(stationId, []);
                return;
            }

            const allowedLines = stationId === STOP_KAPPENBERGWEG ? ["21", "22"] : ["18"];

            const parsed = data.Departure
                .filter(dep => {
                    // BROAD KEY EXTRACTION: Check all common RMV HAFAS line properties
                    let lineStr = "";
                    if (dep.Product) {
                        lineStr = dep.Product.line || dep.Product.number || dep.Product.name || "";
                    }
                    if (!lineStr && dep.name) {
                        lineStr = dep.name;
                    }

                    // Clean up spacing and symbols (e.g., "Bus 21" becomes "21")
                    const cleanLine = lineStr.replace(/\D/g, '').trim();

                    // Cross-check if the stripped numeric representation matches our active filter
                    const matchesLine = allowedLines.some(l => cleanLine === l || lineStr.includes(l));
                    if (!matchesLine) return false;

                    // Filter out outbound routes heading away from downtown
                    const dest = dep.direction ? dep.direction.toLowerCase() : "";
                    return !(dest.includes("medenbach") || dest.includes("naurod") || dest.includes("eigenheim") || dest.includes("bierstadt ost"));
                })
                .map(dep => {
                    // Safely reconstruct the display badge number
                    let cleanLineNum = allowedLines[0];
                    if (dep.Product && dep.Product.line) {
                        cleanLineNum = dep.Product.line.trim();
                    } else if (dep.Product && dep.Product.number) {
                        cleanLineNum = dep.Product.number.trim();
                    } else if (dep.name) {
                        cleanLineNum = dep.name.replace(/\D/g, '').trim();
                    }

                    const targetDate = dep.rtDate ? dep.rtDate : dep.date;
                    const targetTime = dep.rtTime ? dep.rtTime : dep.time;

                    return {
                        line: cleanLineNum,
                        destination: dep.direction || "Wiesbaden Center",
                        origin: stationId === STOP_KAPPENBERGWEG ? "Kappenbergweg" : "Württembergstr.",
                        targetTime: `${targetDate}T${targetTime}`
                    };
                });

            logDebug(`Parsed ${parsed.length} direct runs for stop ${stationId}`);
            processParsedData(stationId, parsed);
        } catch (err) {
            logDebug(`RMV Parser Exception: ${err.message}`);
        }
    };

    function processParsedData(stationId, parsedArray) {
        if (stationId === STOP_KAPPENBERGWEG) kappenbergRaw = parsedArray;
        if (stationId === STOP_WUERTTEMBERG) wuerttembergRaw = parsedArray;

        if (kappenbergRaw !== null && wuerttembergRaw !== null) {
            activeCachedDepartures = [...kappenbergRaw, ...wuerttembergRaw];
            renderDisplay();
        }
    }

    function updateDashboard() {
        logDebug("Verifying system communication pipeline...");
        kappenbergRaw = null;
        wuerttembergRaw = null;

        // FIXED SAFETY GUARD: Prevents computer browser crash if running outside Android environment
        if (typeof window.AndroidBridge !== 'undefined' && window.AndroidBridge) {
            window.AndroidBridge.fetchTransitData(STOP_KAPPENBERGWEG);
            window.AndroidBridge.fetchTransitData(STOP_WUERTTEMBERG);
        } else {
            logDebug("Browser execution context detected. Running layout preview.");
            processParsedData(STOP_KAPPENBERGWEG, getSimulationData(STOP_KAPPENBERGWEG, ["21", "22"]));
            processParsedData(STOP_WUERTTEMBERG, getSimulationData(STOP_WUERTTEMBERG, ["18"]));
        }
    }

    function getSimulationData(stationId, allowedLines) {
        const mockDestinations = { "18": "Wiesbaden Hbf", "21": "Platz d. Deutschen Einheit", "22": "Dernsches Gelände" };
        const results = [];
        const now = new Date();
        allowedLines.forEach(line => {
            let offset = line === "18" ? 4 : (line === "21" ? 9 : 14);
            results.push({
                line: line,
                destination: mockDestinations[line] || "Wiesbaden Mitte",
                origin: stationId === STOP_KAPPENBERGWEG ? "Kappenbergweg" : "Württembergstr.",
                targetTime: new Date(now.getTime() + offset * 60000).toISOString()
            });
        });
        return results;
    }

    function renderDisplay() {
        const board = document.getElementById("display-board");
        const timeLabel = document.getElementById("update-time");
        const now = new Date();

        if (activeCachedDepartures.length === 0) {
            board.innerHTML = `<div class="status-msg">No inbound connections.</div>`;
            return;
        }

        const processedList = activeCachedDepartures.map(bus => {
            const diffMs = new Date(bus.targetTime) - now;
            const diffMins = Math.max(0, Math.round(diffMs / 1000 / 60));
            return { ...bus, minutes: diffMins };
        }).sort((a, b) => a.minutes - b.minutes);

        board.innerHTML = processedList.map(bus => `
            <div class="bus-row line-${bus.line}">
                <div class="bus-meta">
                    <div class="line-badge">${bus.line}</div>
                    <div class="route-info">
                        <div class="destination">${bus.destination}</div>
                        <div class="origin-stop">via ${bus.origin}</div>
                    </div>
                </div>
                <div class="time-info">${bus.minutes === 0 ? "NOW" : bus.minutes + " min"}</div>
            </div>
        `).join('');

        timeLabel.innerText = `Last updated: ${now.toLocaleTimeString('de-DE')}`;
    }

    updateDashboard();
    setInterval(updateDashboard, 60000);
    setInterval(renderDisplay, 10000);
</script>
</body>
</html>
